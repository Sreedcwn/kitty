[package]
name = "kitty"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Rotating savings circles backed by a Sputnik DAO: a member's record of paid dues becomes credit the community stands behind."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30", features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "5.30", features = ["legacy", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true
